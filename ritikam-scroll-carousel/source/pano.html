<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PF;src:url(../fonts/fontsource-playfair-display/files/playfair-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:PF;src:url(../fonts/fontsource-playfair-display/files/playfair-display-latin-800-italic.woff2);font-weight:800;font-style:italic}
@font-face{font-family:PF;src:url(../fonts/fontsource-playfair-display/files/playfair-display-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:AF;src:url(../fonts/fontsource-afacad/files/afacad-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:AF;src:url(../fonts/fontsource-afacad/files/afacad-latin-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:4320px;height:1350px;overflow:hidden}
#p{position:relative;width:4320px;height:1350px;overflow:hidden;background:linear-gradient(180deg,#FBF4EC 0%,#F7EADD 55%,#F2DFCC 100%)}
.abs{position:absolute}
.brown{color:#5F3916}
.cu{background:linear-gradient(180deg,#C8753A 0%,#B5652A 45%,#8E4519 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.h{font-family:PF;font-weight:800;line-height:.98;letter-spacing:-.01em;text-align:center}
.rope{position:absolute;height:30px;background:url(rope_tile_s.png) repeat-x 0 0/218px 30px;filter:drop-shadow(0 10px 7px rgba(95,57,22,.20))}
.chev{position:absolute;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C8753A,#A9561F 70%);display:grid;place-items:center;box-shadow:0 8px 18px rgba(95,57,22,.25)}
.chev svg{width:44px;height:44px;stroke:#F7F1E8;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lv{position:absolute;mix-blend-mode:multiply}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(95,57,22,.30),rgba(95,57,22,0))}
</style></head>
<body><div id="p">
 <!-- soft light pools behind each headline -->
 <svg class="abs" width="4320" height="1350" style="left:0;top:0">
  <defs>
   <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
   <linearGradient id="dune1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F0D6BC"/><stop offset="1" stop-color="#EBCBAB"/></linearGradient>
   <linearGradient id="dune2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E9C6A3"/><stop offset="1" stop-color="#DDB089"/></linearGradient>
  </defs>
  <ellipse cx="700" cy="520" rx="560" ry="420" fill="url(#glow)"/>
  <ellipse cx="1620" cy="560" rx="560" ry="420" fill="url(#glow)"/>
  <ellipse cx="2700" cy="560" rx="560" ry="420" fill="url(#glow)"/>
  <ellipse cx="3780" cy="420" rx="560" ry="420" fill="url(#glow)"/>
  <path d="M0,1105 C520,1040 980,1125 1560,1075 S2650,1010 3200,1080 S4000,1050 4320,1070 L4320,1350 L0,1350Z" fill="url(#dune1)"/>
  <path d="M0,1215 C700,1190 1500,1232 2300,1208 S3700,1188 4320,1210 L4320,1350 L0,1350Z" fill="url(#dune2)"/>
 </svg>

 <!-- leaves (bookends) -->
 <img class="lv" src="leaves_tl.png" style="left:0;top:0;width:400px;height:360px">
 <img class="lv" src="leaves_tl.png" style="left:3990px;top:0;width:330px;height:297px;transform:scaleX(-1)">

 <!-- ===== SLIDE 1 ===== -->
 <img class="abs" src="logo.png" style="left:370px;top:46px;width:340px">
 <div class="abs h" style="left:430px;top:352px;width:640px">
  <div class="brown" style="font-size:150px">Don’t</div>
  <div class="cu" style="font-size:196px;margin-top:-6px;padding-bottom:12px">Scroll.</div>
 </div>
 <svg class="abs" style="left:520px;top:712px" width="470" height="40" viewBox="0 0 470 40"><path d="M4,30 C120,10 300,4 466,12 C320,12 160,20 6,36Z" fill="#B5652A"/></svg>

 <!-- ===== SLIDE 2 ===== -->
 <div class="abs h" style="left:1080px;top:370px;width:1080px">
  <div class="brown" style="font-size:120px">Why are you</div>
  <div class="cu" style="font-size:186px;padding-bottom:20px">scrolling?</div>
 </div>

 <!-- ===== SLIDE 3 ===== -->
 <div class="abs h" style="left:2160px;top:330px;width:1080px">
  <div class="brown" style="font-size:136px">Seriously,</div>
  <div class="cu" style="font-size:240px;padding-bottom:20px">don’t.</div>
 </div>

 <!-- ===== SLIDE 4 ===== -->
 <img class="abs" src="logo.png" style="left:3660px;top:40px;width:240px">
 <div class="abs h" style="left:3240px;top:232px;width:1080px">
  <div style="font-size:112px"><span class="brown">Okay,</span> <span class="cu" style="font-style:italic">fine.</span></div>
 </div>
 <svg class="abs" style="left:3820px;top:342px" width="300" height="30" viewBox="0 0 300 30"><path d="M3,22 C90,8 200,3 297,9 C200,10 100,15 5,27Z" fill="#B5652A"/></svg>
 <div class="abs" style="left:3240px;top:368px;width:1080px;text-align:center;font-family:PF;font-weight:600;font-size:50px;color:#5F3916">You stopped scrolling.</div>
 <div class="abs" style="left:3240px;top:444px;width:1080px;display:flex;align-items:center;justify-content:center;gap:26px">
  <i style="display:block;width:90px;height:2px;background:#C8753A"></i>
  <div style="font-family:AF;font-weight:600;font-size:36px;line-height:1.18;color:#5F3916;text-align:center">Don’t lose money on the<br>wrong water bottle.</div>
  <i style="display:block;width:90px;height:2px;background:#C8753A"></i>
 </div>
 <div class="abs" style="left:3420px;top:556px;width:720px;height:112px;border-radius:16px;background:linear-gradient(180deg,#B8662B,#8E4519);box-shadow:0 12px 26px rgba(95,57,22,.28),inset 0 1px 0 rgba(255,220,180,.5);display:flex;align-items:center;justify-content:center">
  <div style="position:absolute;inset:7px;border:1.5px solid rgba(241,165,108,.75);border-radius:11px"></div>
  <div style="font-family:PF;font-weight:600;font-size:37px;line-height:1.15;color:#F7F1E8;text-align:center">Ritikam is SGS certified<br>with <i style="font-weight:800;color:#FFD9B5">99.5% pure copper.</i></div>
 </div>
 <div class="abs" style="left:3240px;top:1272px;width:1080px;text-align:center;font-family:AF;font-weight:600;font-size:27px;letter-spacing:.24em;color:#5F3916">SHOP NOW · LINK IN BIO →</div>

 <!-- ===== the ONE rope, perfectly horizontal at y=900 ===== -->
 <div class="rope" style="left:395px;width:3060px;top:885px"></div>

 <!-- contact shadows -->
 <div class="shadow" style="left:90px;top:1222px;width:150px;height:30px"></div>
 <div class="shadow" style="left:430px;top:1222px;width:190px;height:30px"></div>
 <div class="shadow" style="left:3240px;top:1200px;width:200px;height:28px"></div>
 <div class="shadow" style="left:3600px;top:1200px;width:170px;height:26px"></div>
 <div class="shadow" style="left:3840px;top:1200px;width:230px;height:26px"></div>

 <!-- people (anchored so both grips sit on y=900) -->
 <img class="abs" src="man_c.png" style="left:-47.8px;top:349.1px;width:978.1px">
 <img class="abs" src="trio.png" style="left:3107px;top:15px;width:1254px">

 <!-- effort marks -->
 <svg class="abs" style="left:8px;top:640px" width="90" height="80" viewBox="0 0 90 80" stroke="#C8753A" stroke-width="7" stroke-linecap="round"><path d="M60,8 L78,30"/><path d="M8,40 L48,48"/><path d="M14,76 L50,62"/></svg>
 <svg class="abs" style="left:3585px;top:680px" width="90" height="80" viewBox="0 0 90 80" stroke="#C8753A" stroke-width="6" stroke-linecap="round"><path d="M30,8 L14,30"/><path d="M82,40 L42,48"/><path d="M76,76 L40,62"/></svg>

 <!-- swipe cues (slides 1–3) -->
 <div class="chev" style="left:950px;top:1222px"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></div>
 <div class="chev" style="left:2030px;top:1222px"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></div>
 <div class="chev" style="left:3110px;top:1222px"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></div>
</div>
<script>document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode()))).then(()=>document.body.dataset.ready=1)</script>
</body></html>
